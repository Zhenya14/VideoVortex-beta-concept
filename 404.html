<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/VideoVortex-beta/" />
  <title>Сторінку не знайдено — VideoVortex</title>
  <meta name="description" content="Сторінку не знайдено. Поверніться на головну VideoVortex." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070a0f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/images/logos/VideoVortex_logo.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="assets/images/logos/VideoVortex_logo_192x192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/stories.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/video.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .not-found {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .not-found__card {
      width: min(100%, 520px);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-highlight), var(--shadow-md);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      animation: vvViewEnter 0.3s ease both;
    }

    .not-found__logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }

    .not-found__code {
      margin: 0;
      color: var(--accent-primary);
      font-size: clamp(72px, 18vw, 112px);
      font-weight: 700;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .not-found__title {
      margin: 18px 0 8px;
      color: var(--text-primary);
      font-size: clamp(22px, 5vw, 30px);
    }

    .not-found__message {
      margin: 0 auto 28px;
      color: var(--text-secondary);
      max-width: 34ch;
    }

    .not-found__home {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      color: #fff;
      font-weight: 600;
      background: var(--accent-primary);
      border-radius: var(--radius-full);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .not-found__home:hover {
      color: #fff;
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .not-found__home:focus-visible {
      outline: 3px solid var(--accent-border);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found__card {
        animation: none;
      }

      .not-found__home {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true"></div>
  <main class="not-found">
    <section class="not-found__card" aria-labelledby="not-found-title">
      <img
        class="not-found__logo"
        src="assets/images/logos/VideoVortex_logo_192x192.png"
        alt="VideoVortex"
        width="64"
        height="64"
      />
      <p class="not-found__code" aria-hidden="true">404</p>
      <h1 class="not-found__title" id="not-found-title">Сторінку не знайдено</h1>
      <p class="not-found__message">Можливо, адресу змінено або сторінку видалено.</p>
      <a class="not-found__home" href="./">
        <span class="material-symbols" aria-hidden="true">home</span>
        На головну
      </a>
    </section>
  </main>
</body>
</html>
